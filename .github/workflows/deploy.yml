name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the latest source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Create .env file from GitHub Secret
      - name: Create .env file from secret
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Build the Docker image and push it to Docker Hub
      - name: Build & push Docker image
        run: |
          docker build -t softvence/navelle_ai:latest .
          docker push softvence/navelle_ai:latest

      # SSH into the VPS and deploy the new Docker image
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Go to the application directory
            cd /home/ubuntu/navelle-ai

            # Stop the currently running containers
            docker compose down

            # Pull the latest Docker image from Docker Hub
            docker compose pull

            # Start the application with the new image
            docker compose up -d

            # Remove unused Docker resources to free disk space
            sudo docker system prune -af
